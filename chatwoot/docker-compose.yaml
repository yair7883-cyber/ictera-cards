# Chatwoot (open source, self-hosted) — based on the official
# docker-compose.production.yaml from github.com/chatwoot/chatwoot
# Versions are pinned so an update never happens by surprise.

x-chatwoot: &chatwoot
  image: chatwoot/chatwoot:v4.20.1
  env_file: .env
  volumes:
    - storage_data:/app/storage
  environment:
    - NODE_ENV=production
    - RAILS_ENV=production
    - INSTALLATION_ENV=docker
  depends_on:
    - postgres
    - redis
  restart: always

services:
  rails:
    <<: *chatwoot
    ports:
      - '127.0.0.1:3000:3000'
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *chatwoot
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  redis:
    image: redis:7-alpine
    restart: always
    command: ['sh', '-c', 'redis-server --requirepass "$$REDIS_PASSWORD"']
    env_file: .env
    volumes:
      - redis_data:/data

volumes:
  storage_data:
  postgres_data:
  redis_data:
